<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サングラス匿名化</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --card:#f3f3f3; --ac:#1f6feb; --warn:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#aaa; --card:#1e1e1e; --ac:#58a6ff; --warn:#fb923c; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; max-width:720px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 16px; font-size:.9rem; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  button, .btn { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:12px 16px; font-size:1rem; }
  button:disabled { opacity:.5; }
  button.sec { background:var(--card); color:var(--fg); }
  select, input[type=range] { font-size:1rem; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin:12px 0; }
  .card canvas { width:100%; height:auto; border-radius:6px; display:block; }
  .warn { color:var(--warn); font-weight:600; }
  #status { color:var(--mut); font-size:.9rem; min-height:1.4em; }
  #summary { font-weight:600; }
</style>
</head>
<body>
<h1>サングラス匿名化</h1>
<p class="sub">写真は端末内だけで処理され、外部へ送信されません。元写真は変更されず、加工済みを別ファイルとして保存します。</p>

<div class="row">
  <button id="pick" class="sec">写真を選ぶ（複数可）</button>
  <input id="file" type="file" accept="image/jpeg,image/png" multiple hidden>
  <label>種類
    <select id="style"><option value="natural">自然</option><option value="bold">太い（匿名化重視）</option></select>
  </label>
</div>
<div class="row">
  <label>大きさ <input id="scale" type="range" min="0.8" max="1.8" step="0.05" value="1.0"> <span id="scaleV">1.00</span></label>
</div>
<div class="row"><button id="run" disabled>加工する</button><button id="saveAll" class="sec" disabled>すべて保存</button></div>
<div id="status">モデルを読み込み中…</div>
<div id="summary"></div>
<div id="list"></div>

<script type="module">
import { FaceLandmarker, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";

const $ = id => document.getElementById(id);
const R_OUTER=33, R_INNER=133, R_TOP=159, R_BOTTOM=145, L_INNER=362, L_OUTER=263, L_TOP=386, L_BOTTOM=374, NOSE=1;
const MIN_EYE_DIST=14, MAX_YAW=0.45, MAX_ROLL=60;
const MAX_SIDE = 12000;

let landmarker = null, poseLandmarker = null, files = [], results = [];

async function init() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  const opts = n => ({
    baseOptions: { modelAssetPath: "models/face_landmarker.task", delegate: n },
    runningMode: "IMAGE", numFaces: 60,
    minFaceDetectionConfidence: 0.3, minFacePresenceConfidence: 0.3,
  });
  try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
  try {
    poseLandmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "models/pose_landmarker_full.task", delegate: "CPU" },
      runningMode: "IMAGE", numPoses: 30, minPoseDetectionConfidence: 0.3, minPosePresenceConfidence: 0.3,
    });
  } catch (e) { console.warn("pose unavailable", e); }
  $("status").textContent = "準備OK。写真を選んでください。";
  updateButtons();
}

function updateButtons() { $("run").disabled = !landmarker || !files.length; }

// ---------- 検出 ----------
function faceFromPoints(P) {
  const mean = ids => [ids.reduce((s,i)=>s+P[i][0],0)/ids.length, ids.reduce((s,i)=>s+P[i][1],0)/ids.length];
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const rEye = mean([R_OUTER,R_INNER,R_TOP,R_BOTTOM]), lEye = mean([L_INNER,L_OUTER,L_TOP,L_BOTTOM]);
  const vSpan = Math.max(Math.abs(P[R_TOP][1]-P[R_BOTTOM][1]), Math.abs(P[L_TOP][1]-P[L_BOTTOM][1]));
  const xs = P.map(p=>p[0]), ys = P.map(p=>p[1]);
  const bbox = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  const dr = dist(P[NOSE], P[R_OUTER]), dl = dist(P[NOSE], P[L_OUTER]);
  const yaw = (dr - dl) / Math.max(dr + dl, 1e-6);
  const f = { rEye, lEye, rOuter:P[R_OUTER], rInner:P[R_INNER], lOuter:P[L_OUTER], lInner:P[L_INNER], vSpan, bbox, yaw, reasons:[], truncated:false };
  const d = dist(lEye, rEye);
  const roll = Math.abs(Math.atan2(lEye[1]-rEye[1], lEye[0]-rEye[0]) * 180 / Math.PI);
  // 目・口の位置関係が顔として自然か（回転検出の誤検出対策）
  const m = [(rEye[0]+lEye[0])/2, (rEye[1]+lEye[1])/2], v = [P[13][0]-m[0], P[13][1]-m[1]];
  const vl = Math.hypot(v[0], v[1]), cross = (lEye[0]-rEye[0])*v[1] - (lEye[1]-rEye[1])*v[0];
  const cosA = ((lEye[0]-rEye[0])*v[0] + (lEye[1]-rEye[1])*v[1]) / Math.max(d * vl, 1e-6);
  if (cross <= 0 || vl / Math.max(d, 1e-6) < 0.6 || vl / Math.max(d, 1e-6) > 3.5 || Math.abs(cosA) > 0.6) f.reasons.push("目の位置が不確実");
  if (Math.max(bbox[2]-bbox[0], bbox[3]-bbox[1]) / Math.max(d, 1e-6) > 4.2) f.reasons.push("横顔");
  if (d < MIN_EYE_DIST) f.reasons.push("小さい顔");
  if (Math.abs(yaw) > MAX_YAW) f.reasons.push("横向き");
  if (roll > MAX_ROLL && roll < 180 - MAX_ROLL) f.reasons.push("大きく傾いている");
  return f;
}

function iou(a, b) {
  const ix = Math.max(0, Math.min(a[2],b[2]) - Math.max(a[0],b[0]));
  const iy = Math.max(0, Math.min(a[3],b[3]) - Math.max(a[1],b[1]));
  const inter = ix * iy;
  const ua = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter;
  return ua > 0 ? inter / ua : 0;
}
function sameFace(a, b) {
  if (iou(a.bbox, b.bbox) > 0.3) return true;
  const ca = [(a.rEye[0]+a.lEye[0])/2, (a.rEye[1]+a.lEye[1])/2];
  const cb = [(b.rEye[0]+b.lEye[0])/2, (b.rEye[1]+b.lEye[1])/2];
  const da = Math.hypot(a.lEye[0]-a.rEye[0], a.lEye[1]-a.rEye[1]);
  const db = Math.hypot(b.lEye[0]-b.rEye[0], b.lEye[1]-b.rEye[1]);
  return Math.hypot(ca[0]-cb[0], ca[1]-cb[1]) < 0.6 * Math.max(da, db);
}
function* tileGrid(w, h, n, overlap = 0.25) {
  const k = n - (n - 1) * overlap, tw = w / k, th = h / k;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x0 = Math.round(i * tw * (1 - overlap)), y0 = Math.round(j * th * (1 - overlap));
    yield [x0, y0, Math.min(w, Math.round(x0 + tw)), Math.min(h, Math.round(y0 + th))];
  }
}

// 回転0/90/180/270度で検出し、座標を元の向きに戻す（寝ている人・横倒しの顔対策）
function toOriginal(rot, rx, ry, w, h) {
  if (rot === 0) return [rx, ry];
  if (rot === 90) return [ry, h - rx];
  if (rot === 180) return [w - rx, h - ry];
  return [w - ry, rx];   // 270
}

function detectRegion(src, box, W, H, out, rots) {
  const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0;
  const s = Math.max(w, h) < 640 ? 640 / Math.max(w, h) : 1;   // 検出用コピーだけ拡大（元画像は不変）
  const cw = Math.round(w * s), ch = Math.round(h * s);
  const mx = 0.02 * w, my = 0.02 * h;
  for (const rot of rots) {
    const swap = rot === 90 || rot === 270;
    const c = document.createElement("canvas");
    c.width = swap ? ch : cw; c.height = swap ? cw : ch;
    const ctx = c.getContext("2d");
    if (rot === 90) { ctx.translate(ch, 0); ctx.rotate(Math.PI / 2); }
    else if (rot === 180) { ctx.translate(cw, ch); ctx.rotate(Math.PI); }
    else if (rot === 270) { ctx.translate(0, cw); ctx.rotate(-Math.PI / 2); }
    ctx.drawImage(src, x0, y0, w, h, 0, 0, cw, ch);
    const rw = swap ? h : w, rh = swap ? w : h;   // 回転後の画像の、元スケールでの大きさ
    const res = landmarker.detect(c);
    for (const lm of res.faceLandmarks) {
      const P = lm.map(p => { const q = toOriginal(rot, p.x * rw, p.y * rh, w, h); return [q[0] + x0, q[1] + y0]; });
      const f = faceFromPoints(P); f.rot = rot;
      const [a, b, c2, d] = f.bbox;
      f.truncated = (x0 > 0 && a < x0 + mx) || (y0 > 0 && b < y0 + my) || (x1 < W && c2 > x1 - mx) || (y1 < H && d > y1 - my);
      out.push(f);
    }
  }
}

// ---------- 横顔: 姿勢推定で頭の位置を取り、目の位置に太いバーを置く ----------
const PROFILE_RATIO = 3.0;
function poseHeads(src, W, H) {
  const res = poseLandmarker.detect(src);
  const heads = [];
  for (const lm of res.landmarks) {
    const P = lm.slice(0, 9).map(p => [p.x * W, p.y * H]);
    if ([0, 2, 5].some(i => (lm[i].visibility ?? 1) < 0.3)) continue;
    const eye = [0, 1].map(k => P.slice(1, 7).reduce((s, p) => s + p[k], 0) / 6);
    const ear = [0, 1].map(k => (P[7][k] + P[8][k]) / 2);
    const L = Math.hypot(eye[0]-ear[0], eye[1]-ear[1]);
    const eyeD = Math.hypot(P[2][0]-P[5][0], P[2][1]-P[5][1]);
    if (L < 4) continue;
    heads.push({ eye, ear, L, ratio: L / Math.max(eyeD, 1e-6) });
  }
  return heads;
}
function faceFromHead(h) {
  const [ex, ey] = h.eye, ang = Math.atan2(ey - h.ear[1], ex - h.ear[0]), z = [ex, ey];
  return { rEye: z, lEye: z, rOuter: z, rInner: z, lOuter: z, lInner: z, vSpan: h.L * 0.3,
    bbox: [ex - h.L, ey - h.L, ex + h.L, ey + h.L], yaw: 0.9, truncated: false,
    bar: { cx: ex, cy: ey, len: h.L, hgt: h.L * 0.5, ang }, reasons: ["横顔(姿勢推定)"] };
}
function headContains(f, h) {
  const [x0, y0, x1, y1] = f.bbox, m = 0.2 * Math.max(x1 - x0, y1 - y0);
  if (h.eye[0] >= x0 - m && h.eye[0] <= x1 + m && h.eye[1] >= y0 - m && h.eye[1] <= y1 + m) return true;
  return Math.hypot((x0+x1)/2 - h.eye[0], (y0+y1)/2 - h.eye[1]) < 2 * h.L;
}
function mergePose(src, W, H, faces) {
  if (!poseLandmarker) return faces;
  let out = faces.slice();
  for (const h of poseHeads(src, W, H)) {
    const near = out.filter(f => headContains(f, h));
    if (h.ratio >= PROFILE_RATIO) { out = out.filter(f => !near.includes(f)); out.push(faceFromHead(h)); }
    else if (!near.length) { const f = faceFromHead(h); f.reasons = ["姿勢推定のみ"]; out.push(f); }
  }
  return out;
}

async function detectFaces(src, W, H, onProg) {
  const found = [];
  const levels = [1, 2, 3, 4].filter(n => n === 1 || Math.min(W, H) / n >= 200);
  const total = levels.reduce((s, n) => s + n * n, 0); let done = 0;
  for (const n of levels) for (const box of tileGrid(W, H, n)) {
    detectRegion(src, box, W, H, found, n <= 2 ? [0, 90, 180, 270] : [0]);
    onProg(++done / total);
    await new Promise(r => setTimeout(r));   // UIを固めない
  }
  found.sort((a, b) => (a.truncated - b.truncated) || ((a.reasons.length > 0) - (b.reasons.length > 0)) || ((a.rot !== 0) - (b.rot !== 0)) ||
    ((b.bbox[2]-b.bbox[0])*(b.bbox[3]-b.bbox[1]) - (a.bbox[2]-a.bbox[0])*(a.bbox[3]-a.bbox[1])));
  const kept = [];
  for (const f of found) if (!kept.some(k => sameFace(f, k))) kept.push(f);
  const merged = mergePose(src, W, H, kept);
  merged.sort((a, b) => a.bbox[1] - b.bbox[1] || a.bbox[0] - b.bbox[0]);
  return merged;
}

// ---------- 合成（サングラスの部分だけ黒で塗る） ----------
function drawGlasses(ctx, f, style, scale) {
  if (f.bar) {
    const b = f.bar, len = b.len * scale, hgt = b.hgt * scale;
    ctx.save(); ctx.translate(b.cx, b.cy); ctx.rotate(b.ang); ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.roundRect(-len / 2, -hgt / 2, len, hgt, hgt * 0.35); ctx.fill(); ctx.restore();
    return;
  }
  const m = [(f.rEye[0]+f.lEye[0])/2, (f.rEye[1]+f.lEye[1])/2];
  const ax = [f.lEye[0]-f.rEye[0], f.lEye[1]-f.rEye[1]];
  const d = Math.hypot(ax[0], ax[1]);
  const ex = [ax[0]/d, ax[1]/d], ey = [-ex[1], ex[0]];
  const theta = Math.atan2(ax[1], ax[0]);
  const wR = Math.hypot(f.rOuter[0]-f.rInner[0], f.rOuter[1]-f.rInner[1]);
  const wL = Math.hypot(f.lOuter[0]-f.lInner[0], f.lOuter[1]-f.lInner[1]);
  const bold = style === "bold";
  const lens = [[f.rEye, wR], [f.lEye, wL]].map(([eye, we]) => {
    const lw = Math.max(we * (bold ? 2.3 : 2.0), d * 0.55) * scale;      // 目より少し大きめに覆う
    const lh = Math.max(lw * (bold ? 0.78 : 0.62), f.vSpan * 2.6 * scale);
    const rx = eye[0]-m[0], ry = eye[1]-m[1];
    return { u: rx*ex[0]+ry*ex[1], v: rx*ey[0]+ry*ey[1], w: lw, h: lh };
  });
  ctx.save();
  ctx.translate(m[0], m[1]); ctx.rotate(theta);
  ctx.fillStyle = "#000";
  const rr = (u, v, w, h, r) => { ctx.beginPath(); ctx.roundRect(u - w/2, v - h/2, w, h, r); ctx.fill(); };
  if (bold) {
    const u0 = Math.min(...lens.map(l => l.u - l.w/2)), u1 = Math.max(...lens.map(l => l.u + l.w/2));
    const hh = Math.max(...lens.map(l => l.h));
    rr((u0+u1)/2, (lens[0].v+lens[1].v)/2, u1-u0, hh, hh*0.35);
  } else {
    for (const l of lens) rr(l.u, l.v, l.w, l.h, l.h*0.4);
    const ua = lens[0].u + lens[0].w*0.4, ub = lens[1].u - lens[1].w*0.4;
    const th = Math.max(lens[0].h, lens[1].h) * 0.16;
    rr((ua+ub)/2, (lens[0].v+lens[1].v)/2 - lens[0].h*0.15, Math.abs(ub-ua), th, th/2);
  }
  ctx.restore();
}

// ---------- UI ----------
const needsReview = f => f.reasons.length > 0;

function drawFace(ctx, f, style, scale) {
  drawGlasses(ctx, f, style, scale);
}

function makeCard(name) {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = `<div><b></b></div><div class="info">待機中</div><canvas></canvas>
    <div class="row"><button class="sec save" disabled>保存</button></div>`;
  el.querySelector("b").textContent = name;
  $("list").appendChild(el);
  return el;
}

function renderPreview(r) {
  const { img, faces, W, H } = r;
  const style = $("style").value, scale = parseFloat($("scale").value);
  const pv = r.card.querySelector("canvas"), k = Math.min(1, 1000 / Math.max(W, H));
  pv.width = Math.round(W * k); pv.height = Math.round(H * k);
  const pc = pv.getContext("2d");
  pc.drawImage(img, 0, 0, pv.width, pv.height);
  pc.save(); pc.scale(k, k);
  for (const f of faces) drawFace(pc, f, style, scale);
  pc.restore();
  // 目印（プレビューだけ。保存画像には入らない）
  pc.lineWidth = 3;
  for (const f of faces) if (needsReview(f)) {
    pc.strokeStyle = "#f97316"; const [a, b, c, d] = f.bbox; pc.strokeRect(a*k, b*k, (c-a)*k, (d-b)*k);
  }
}

function updateInfo(r) {
  const vis = r.faces, rv = vis.filter(needsReview);
  r.card.querySelector(".info").innerHTML =
    `検出 ${vis.length}人 / <span class="${rv.length||!vis.length?'warn':''}">要確認 ${rv.length}人${vis.length ? "" : "（顔0件：要確認）"}</span>`
    + (rv.length ? `<br><span class="warn">${rv.map(f=>f.reasons.join("/")).join("、")}</span>（オレンジ枠）` : "");
  summarize();
}

function summarize() {
  const vis = r => r.faces;
  const n = results.reduce((s, r) => s + vis(r).length, 0);
  const rv = results.reduce((s, r) => s + r.faces.filter(needsReview).length, 0);
  const zero = results.filter(r => !vis(r).length).length;
  $("summary").innerHTML = `合計 ${results.length}枚 / 検出 ${n}人 / <span class="${rv||zero?'warn':''}">要確認 ${rv}人${zero ? ` / 顔0件 ${zero}枚` : ""}</span>`;
}

function save(r) {
  // 保存用は元の解像度で合成する（元画像の画素はサングラス以外そのまま）
  const style = $("style").value, scale = parseFloat($("scale").value);
  const out = document.createElement("canvas"); out.width = r.W; out.height = r.H;
  const ctx = out.getContext("2d"); ctx.drawImage(r.img, 0, 0);
  for (const f of r.faces) drawFace(ctx, f, style, scale);
  out.toBlob(async blob => {
    const base = r.name.replace(/\.[^.]+$/, "");
    const fname = `${base}_sunglasses.${r.png ? "png" : "jpg"}`;
    const file = new File([blob], fname, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, r.png ? "image/png" : "image/jpeg", 1.0);
}

$("pick").onclick = () => $("file").click();
$("file").onchange = e => { files = [...e.target.files]; $("list").innerHTML = ""; results = []; $("summary").textContent = ""; $("saveAll").disabled = true; $("status").textContent = `${files.length}枚を選択`; updateButtons(); };
$("scale").oninput = () => { $("scaleV").textContent = parseFloat($("scale").value).toFixed(2); };
const rerender = () => { results.forEach(renderPreview); };
$("scale").onchange = rerender; $("style").onchange = rerender;

$("run").onclick = async () => {
  $("run").disabled = true; $("list").innerHTML = ""; results = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i], card = makeCard(file.name), info = card.querySelector(".info");
    try {
      // 向き(EXIF)は画素に反映して読む → 横倒し事故を防ぐ
      const img = await createImageBitmap(file, { imageOrientation: "from-image" });
      const W = img.width, H = img.height;
      if (Math.max(W, H) > MAX_SIDE) throw new Error("画像が大きすぎます");
      $("status").textContent = `処理中 ${i + 1}/${files.length}`;
      const faces = await detectFaces(img, W, H, p => info.textContent = `検出中 ${Math.round(p * 100)}%`);
      const r = { name: file.name, png: /png$/i.test(file.type), img, faces, W, H, card };
      results.push(r); renderPreview(r); updateInfo(r);
      card.querySelector(".save").disabled = false;
      card.querySelector(".save").onclick = () => save(r);
    } catch (e) { info.textContent = "失敗: " + e.message; info.className = "info warn"; }
  }
  summarize();
  $("status").textContent = "完了";
  $("run").disabled = false; $("saveAll").disabled = !results.length;
};
$("saveAll").onclick = async () => { for (const r of results) { save(r); await new Promise(r => setTimeout(r, 600)); } };

init().catch(e => { $("status").textContent = "読み込み失敗: " + e.message; });
</script>
</body>
</html>
